name: Correct finance daily summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct verified backend summary
        env:
          SUPABASE_URL: https://qsqnxmotgocesnmodmfz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/correct-finance-summary.mjs
